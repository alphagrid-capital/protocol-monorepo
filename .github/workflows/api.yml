name: API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Wrangler environment to deploy (default: all)"
        required: false
        type: choice
        options:
          - all
          - arbitrum-sepolia
          - robinhood-testnet
          - arbitrum-one

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: api

jobs:
  check:
    name: TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn type-check

  resolve-deploy-matrix:
    name: Resolve deploy targets
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      environments: ${{ steps.set-matrix.outputs.environments }}
    steps:
      - id: set-matrix
        run: |
          ALL='["arbitrum-sepolia","robinhood-testnet","arbitrum-one"]'
          case "${{ github.event_name }}" in
            workflow_dispatch)
              case "${{ github.event.inputs.environment }}" in
                arbitrum-sepolia|robinhood-testnet|arbitrum-one)
                  echo "environments=[\"${{ github.event.inputs.environment }}\"]" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "environments=$ALL" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              ;;
            *)
              echo "environments=$ALL" >> "$GITHUB_OUTPUT"
              ;;
          esac

  deploy:
    name: Deploy (${{ matrix.environment }})
    needs: resolve-deploy-matrix
    if: needs.resolve-deploy-matrix.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.resolve-deploy-matrix.outputs.environments) }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn
          cache-dependency-path: api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          environment: ${{ matrix.environment }}
          command: d1 migrations apply alphagrid-users-${{ matrix.environment }} --env ${{ matrix.environment }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          # `environment` scopes both `wrangler secret bulk` and `wrangler deploy` to the Wrangler env.
          # Putting --env only in `command` deploys the right Worker but uploads secrets to the default worker.
          environment: ${{ matrix.environment }}
          command: deploy
          secrets: |
            RPC_URL
            X402_FACILITATOR_URL
            ORACLE_KEEPER_PRIVATE_KEY
            RELAYER_PRIVATE_KEY
            EXECUTOR_PRIVATE_KEY
            FINNHUB_API_KEY
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
          X402_FACILITATOR_URL: ${{ secrets.X402_FACILITATOR_URL }}
          ORACLE_KEEPER_PRIVATE_KEY: ${{ secrets.ORACLE_KEEPER_PRIVATE_KEY }}
          RELAYER_PRIVATE_KEY: ${{ secrets.RELAYER_PRIVATE_KEY }}
          EXECUTOR_PRIVATE_KEY: ${{ secrets.EXECUTOR_PRIVATE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
