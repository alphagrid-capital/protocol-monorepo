[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

fuzz.runs = 256

[profile.ci]
fuzz.runs = 1000
deny = "warnings"

[rpc_endpoints]
local = "http://127.0.0.1:8545"
robinhood = "${ROBINHOOD_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[lint]
# block-timestamp: intentional for EIP-712 deadlines and Chainlink staleness (low proposer skew is acceptable)
exclude_lints = ["asm-keccak256", "block-timestamp"]
