name = "alphagrid-wallet-mcp"
main = "src/worker.ts"
compatibility_date = "2025-05-31"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
NETWORK_ID = "base-sepolia"
WALLET_PROVIDER = "cdp"
# CDP_API_KEY_ID, CDP_API_KEY_SECRET, CDP_WALLET_SECRET — use `wrangler secret put`
# Optional: ADDRESS, OWNER_ADDRESS, RPC_URL, PAYMASTER_URL
