name = "alphagrid-api"
main = "src/index.ts"
compatibility_date = "2025-05-31"
compatibility_flags = ["nodejs_compat"]

# Workers Logs + tracing in the Cloudflare dashboard (Observability).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

# Agent registration (vars; set secrets in dashboard / `wrangler secret put`)
[vars]
# RPC_URL = "https://..."
# CHAIN_ID = "84532"
# X402_NETWORK = "eip155:84532"
# X402_FACILITATOR_URL = "https://x402.org/facilitator"
# RELAYER_PRIVATE_KEY — use `wrangler secret put RELAYER_PRIVATE_KEY` (never commit)
# EXECUTOR_PRIVATE_KEY — use `wrangler secret put EXECUTOR_PRIVATE_KEY` (TradeRouter EXECUTOR_ROLE)
# TRADE_ROUTER_ADDRESS — optional if set in api/src/constants/contracts.ts
ENABLE_SWAGGER="true"
# FINNHUB_API_KEY — `wrangler secret put FINNHUB_API_KEY`
# ORACLE_KEEPER_PRIVATE_KEY — `wrangler secret put ORACLE_KEEPER_PRIVATE_KEY` (ORACLE_UPDATER on MockPriceOracle)
# ORACLE_REFRESH_SECRET — optional; `wrangler secret put ORACLE_REFRESH_SECRET` for POST /prices/refresh

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "AlphagridMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlphagridMcp"]

[triggers]
crons = ["*/15 * * * *"]
