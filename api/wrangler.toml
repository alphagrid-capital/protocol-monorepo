name = "alphagrid-api"
main = "src/index.ts"
compatibility_date = "2025-05-31"

# Workers Logs + tracing in the Cloudflare dashboard (Observability).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

