name = "alphagrid-api"
main = "src/index.ts"
compatibility_date = "2025-05-31"
compatibility_flags = ["nodejs_compat"]

# Workers Logs + tracing in the Cloudflare dashboard (Observability).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

# Local dev defaults (override with api/.dev.vars or `wrangler dev --env <name>`).
[vars]
ENABLE_SWAGGER = "true"
# RPC_URL — api/.dev.vars or `wrangler secret put RPC_URL --env <name>`
# RELAYER_PRIVATE_KEY — `wrangler secret put RELAYER_PRIVATE_KEY --env <name>`
# EXECUTOR_PRIVATE_KEY — `wrangler secret put EXECUTOR_PRIVATE_KEY --env <name>`
# ORACLE_KEEPER_PRIVATE_KEY — `wrangler secret put ORACLE_KEEPER_PRIVATE_KEY --env <name>`
# FINNHUB_API_KEY — `wrangler secret put FINNHUB_API_KEY --env <name>`
# X402_FACILITATOR_URL — `wrangler secret put X402_FACILITATOR_URL --env <name>`
# ORACLE_REFRESH_SECRET — optional; protects POST /prices/refresh

# Top-level bindings for plain `wrangler dev` (no --env).
[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "AlphagridMcp"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlphagridMcp"]

[triggers]
crons = ["*/15 * * * *"]

# --- Per-chain deployments (one Worker per network) ---
# Deploy: wrangler deploy --env <name>
# CI deploys all three on push to main (see .github/workflows/api.yml).
#
# durable_objects, migrations, and triggers are NOT inherited by [env.*] — repeat per env.

[env.arbitrum-sepolia]
name = "alphagrid-api-arbitrum-sepolia"

[env.arbitrum-sepolia.vars]
CHAIN_ID = "421614"
X402_NETWORK = "eip155:421614"
ENABLE_SWAGGER = "true"
SUBGRAPH_URL = "https://api.studio.thegraph.com/query/1724541/alphagrid-protocol-subgraph-arbitrum-sepolia/version/latest"

[[env.arbitrum-sepolia.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "AlphagridMcp"

[[env.arbitrum-sepolia.migrations]]
tag = "v1"
new_sqlite_classes = ["AlphagridMcp"]

[env.arbitrum-sepolia.triggers]
crons = ["* * * * *"]

[env.robinhood-testnet]
name = "alphagrid-api-robinhood"

[env.robinhood-testnet.vars]
CHAIN_ID = "46630"
X402_NETWORK = "eip155:46630"
ENABLE_SWAGGER = "true"

[[env.robinhood-testnet.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "AlphagridMcp"

[[env.robinhood-testnet.migrations]]
tag = "v1"
new_sqlite_classes = ["AlphagridMcp"]

[env.robinhood-testnet.triggers]
crons = ["*/15 * * * *"]

[env.arbitrum-one]
name = "alphagrid-api-arbitrum-one"

[env.arbitrum-one.vars]
CHAIN_ID = "42161"
X402_NETWORK = "eip155:42161"
ENABLE_SWAGGER = "false"
SUBGRAPH_URL = "https://api.studio.thegraph.com/query/1724541/alphagrid-protocol-subgraph-arbitrum-one/version/latest"

[[env.arbitrum-one.durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "AlphagridMcp"

[[env.arbitrum-one.migrations]]
tag = "v1"
new_sqlite_classes = ["AlphagridMcp"]

[env.arbitrum-one.triggers]
crons = ["*/15 * * * *"]
